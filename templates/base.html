<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Track assignments and see what to work on first.">
  <title>{% block title %}Study Planner{% endblock %}</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%231f5d4a'/%3E%3Cpath d='M9 17l5 5 9-11' fill='none' stroke='%23f7f7f5' stroke-width='3.5' stroke-linecap='round' stroke-linejoin='round'/%3E%3C/svg%3E">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600;700&display=swap">
  <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
  <a class="skip" href="#main">Skip to content</a>
  <header>
    <nav class="site-nav" aria-label="Main">
      <a class="brand" href="{{ url_for('home') }}">Study<span>Planner</span></a>
      <div class="links">
        <a href="{{ url_for('home') }}" {% if request.endpoint == 'home' %}aria-current="page"{% endif %}>Home</a>
        <a href="{{ url_for('add') }}" {% if request.endpoint == 'add' %}aria-current="page"{% endif %}>Add assignment</a>
        <a href="{{ url_for('assignments') }}" {% if request.endpoint == 'assignments' %}aria-current="page"{% endif %}>Search &amp; filter</a>
      </div>
    </nav>
  </header>
  <main id="main">
    {% with messages = get_flashed_messages(with_categories=true) %}
      {% for category, message in messages %}
        <div class="flash {{ category }}" role="status">{{ message }}</div>
      {% endfor %}
    {% endwith %}
    {% block content %}{% endblock %}
  </main>
  <script src="{{ url_for('static', filename='dropdown.js') }}" defer></script>
</body>
</html>
